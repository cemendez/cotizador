services:
  db:
    image: postgres:17
    container_name: cotizador-db
    environment:
      POSTGRES_USER: cotizador
      POSTGRES_PASSWORD: cotizador
      POSTGRES_DB: cotizador
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  db-test:
    image: postgres:17
    container_name: cotizador-db-test
    environment:
      POSTGRES_USER: cotizador
      POSTGRES_PASSWORD: cotizador
      POSTGRES_DB: cotizador_test
    ports:
      - "5435:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pgdata: