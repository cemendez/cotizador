info:
  name: Crear registro
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: '{ "email": "emmanuel@test.com", "name": "Emmanuel", "password": "12345678" }'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.accessToken) {
          bru.setEnvVar("accessToken", res.body.accessToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
