info:
  name: Login
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: '{ "email": "emmanuel@test.com", "password": "12345678" }'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.accessToken) {
          bru.setEnvVar("accessToken", res.body.accessToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
