info:
  name: Refresh
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/refresh"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.accessToken) {
          bru.setEnvVar("accessToken", res.body.accessToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
