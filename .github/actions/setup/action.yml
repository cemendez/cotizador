name: Preparar entorno
description: Instala pnpm, Node y las dependencias del monorepo, y genera el cliente de Prisma

runs:
  using: composite
  steps:
    # Sin "version": pnpm/action-setup la toma del campo packageManager de tu package.json
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - name: Instalar dependencias
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Generar el cliente de Prisma
      shell: bash
      run: pnpm db:generate